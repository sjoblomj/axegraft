<style>
  body { padding: 10px 16px; overflow: auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
  .summary { font-size: 16px; font-weight: 600; padding: 4px 8px; display: inline-block; }
  .summary.passed { background: #c8f0c0; }
  .summary.failed { background: #ffc8c8; }
  #results { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .result { display: grid; grid-template-columns: 100px 1fr; gap: 0 8px; padding: 1px 4px; }
  .result .status { font-weight: bold; }
  .result.pass .status { color: #0a5a00; }
  .result.fail { background: #ffe4e4; }
  .result.fail .status { color: #a00000; }
  .result.not-checked .status { color: #6a5000; }
  .result .message { grid-column: 2; margin: 0; white-space: pre-wrap; font-size: 11px; }
  #sandbox { position: absolute; left: -10000px; top: 0; width: 1280px; height: 900px; }
</style>
</head>

<h1>AxeGraft Editor tests</h1>
<p>Every test runs when this page opens. Tests that read the editor's own files, or real game files, run once you choose that folder below. Until then they're listed as not checked.</p>
<div class="bar">
  <label>Editor folder (for source tree tests): <input type="file" id="source-dir" webkitdirectory multiple></label>
  <label>Game folder (for game file tests): <input type="file" id="game-dir" webkitdirectory multiple></label>
  <button id="rerun" type="button">Run again</button>
</div>
<div id="summary" class="summary">Loading...</div>
<ol id="results"></ol>
<div id="sandbox" aria-hidden="true"></div>
