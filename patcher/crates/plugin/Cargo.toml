[package]
name = "axegraft-patcher-plugin"
description = "AxeGraft Patcher, an MPQDraft plugin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Built as AxeGraftPatcher.dll, which is shipped as AxeGraftPatcher.qdp.
name = "AxeGraftPatcher"
crate-type = ["cdylib", "rlib"]

[features]
# Lets the Wine tests make the plugin panic, and choose a mod file without the
# dialog. Never enabled in a release.
test-hooks = []

[dependencies]
axegraft-patcher-core.workspace = true
axegraft-patcher-library.workspace = true
